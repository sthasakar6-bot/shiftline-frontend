<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <!-- A URL of its own, not shared with the manifest icon above -- iOS
         permanently caches a "no icon" result the first time it fails to
         fetch a page's apple-touch-icon, and never retries the same URL
         even after the file starts resolving correctly. Renaming this file
         is the only reliable way to make an already-affected phone pick up
         a fixed icon; bump the filename again if this ever needs a forced
         refresh in the future. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Dancing+Script:wght@600&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap"
      rel="stylesheet"
    />
    <title>Shiftline</title>
    <script>
      // Applied before any stylesheet paints so a stored theme choice
      // (or the system preference, if none was chosen yet) never flashes
      // the "wrong" theme for a frame. Kept in sync with src/lib/theme.ts.
      (function () {
        try {
          var stored = localStorage.getItem("shiftline-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
